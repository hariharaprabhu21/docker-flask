name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHECK_SECRETS: ${{ github.event_name == 'push' }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/pre_validate.py
      - name: Block xcopy
        run: |
          if grep -rniL "xcopy" --exclude-dir=.git --exclude-dir=.github .; then
            echo "ERROR: xcopy is not allowed. Use robocopy instead"
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t docker-flask:scan .
      - name: scan image with trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-flask:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" 

  build:
    needs: scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin
      - run: docker build -t "$DOCKER_USER/docker-flask:${{ github.sha }}" .
      - run: docker push "$DOCKER_USER/docker-flask:${{ github.sha }}"